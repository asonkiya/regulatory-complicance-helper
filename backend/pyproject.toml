[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "accessibility-copilot"
version = "0.1.0"
description = "Accessibility Copilot for Course Materials"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1.0",
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    # Config
    "pydantic-settings>=2.3.0",
    # Task queue
    "celery[redis,gevent]>=5.4.0",
    "redis>=5.0.0",
    # AI / ML
    "anthropic>=0.34.0",
    "faster-whisper>=1.0.0",
    "pytesseract>=0.3.13",
    "Pillow>=10.4.0",
    # File processing
    "python-pptx>=1.0.0",
    "pdfplumber>=0.11.0",
    "pymupdf>=1.24.0",
    "pikepdf>=9.0.0",
    # Utilities
    "tenacity>=8.5.0",
    "python-magic>=0.4.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
